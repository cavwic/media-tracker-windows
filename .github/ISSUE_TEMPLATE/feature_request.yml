name: 功能建议 / Feature request
description: 建议本地媒体管理、同步或界面改进。
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        当前仅支持 Windows x64。请勿提交私人账号、媒体或登录资料。
        不接受验证码破解、DRM 解密、平台限制规避或要求用户关闭系统安全功能的方案。
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的操作或效果 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives
